# global settings apply to every scrape job unless overridden.
global:
  scrape_interval: 15s        # how often Prometheus pulls /metrics
  evaluation_interval: 15s    # how often alert + recording rules are evaluated
  external_labels:
    cluster: obs-lab
    env: dev

# Files containing recording rules and alerting rules.
# You will write these in Hours 5 and 6.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # One job for all four app services. The `service` label is what lets you
  # write   sum by (service) (rate(...))   later on.
  - job_name: pizza-app
    static_configs:
      - targets: ["gateway:8000"]
        labels: {service: gateway}
      - targets: ["orders:8000"]
        labels: {service: orders}
      - targets: ["payments:8000"]
        labels: {service: payments}
      - targets: ["bank:8000"]
        labels: {service: bank}

  # The MACHINE: CPU, memory, disk, network of the WSL host.
  # This is where you learn the USE method (Utilisation, Saturation, Errors).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The CONTAINERS: per-container CPU, memory, throttling, restarts.
  # cAdvisor emits a LOT of series - a good place to see cardinality bite.
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop the noisiest cAdvisor metrics we will not use. Deliberate: this is
      # how you control ingestion cost in production.
      - source_labels: ["__name__"]
        regex: "container_(tasks_state|memory_failures_total|blkio_device_usage_total).*"
        action: drop
