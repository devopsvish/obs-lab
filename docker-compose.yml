# Ports are published on all interfaces, which means your EC2 SECURITY GROUP is
# the only thing protecting this lab. Inbound rules must be scoped to your own
# IP - never 0.0.0.0/0. None of these tools has authentication by default, and
# Grafana is deliberately running with anonymous admin for lab convenience.
# If your IP changes, update the SG. See docs/ec2-setup.md.
#
# Profiles keep RAM usage low:
#   docker compose up -d                      -> app + metrics + alerting (Hours 2,3,5,6)
#   docker compose --profile logs   up -d     -> adds Loki + Promtail     (Hour 4)
#   docker compose --profile traces up -d     -> adds Tempo               (Hour 4)

name: obs-lab

x-app-base: &app-base
  build:
    context: ./app
  restart: unless-stopped
  environment: &app-env
    REDIS_URL: redis://redis:6379/0
    POSTGRES_DSN: postgresql://pizza:pizza@postgres:5432/pizza
    ORDERS_URL: http://orders:8000
    PAYMENTS_URL: http://payments:8000
    BANK_URL: http://bank:8000
  depends_on:
    redis:
      condition: service_healthy
  mem_limit: 256m

services:
  # ---------- data stores ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizza
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    # NO published port. chaos.sh reaches Redis via `docker compose exec`.
    # An internet-facing unauthenticated Redis is one of the most reliably
    # exploited misconfigurations there is. Keep it on the internal network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 128m

  # ---------- application ----------
  gateway:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE: gateway
    ports: ["8000:8000"]

  orders:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE: orders
    ports: ["8001:8000"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  payments:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE: payments
    ports: ["8002:8000"]

  bank:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE: bank
    ports: ["8003:8000"]

  # ---------- observability ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle          # lets you POST /-/reload instead of restarting
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    mem_limit: 128m

  pager:
    build: ./pager
    ports: ["8090:8000"]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    mem_limit: 384m

  # ---------- infrastructure metrics ----------
  # node-exporter = the MACHINE (CPU, RAM, disk, network of your WSL host)
  #
  # NOTE FOR WSL: we mount /proc and /sys explicitly rather than bind-mounting
  # / with rslave propagation. WSL2 marks / as a private mount, so Docker
  # refuses rslave. Mounting the two paths directly sidesteps it entirely.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Ignore pseudo-filesystems and your Windows drives mounted at /mnt/c etc.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|mnt/[a-z])($$|/)
      - --no-collector.hwmon
      - --no-collector.thermal_zone
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports: ["9100:9100"]
    mem_limit: 128m

  # cAdvisor = the CONTAINERS (per-container CPU, memory, throttling, restarts)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command: ["--housekeeping_interval=10s", "--docker_only=true"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports: ["8080:8080"]
    mem_limit: 256m

  # ---------- logs (profile: logs) ----------
  loki:
    image: grafana/loki:3.3.2
    profiles: ["logs"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    ports: ["3100:3100"]
    mem_limit: 384m

  promtail:
    image: grafana/promtail:3.3.2
    profiles: ["logs"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  # ---------- traces (profile: traces) ----------
  tempo:
    image: grafana/tempo:2.7.0
    profiles: ["traces"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports: ["3200:3200", "4317:4317"]
    mem_limit: 384m

  # ---------- load generator ----------
  k6:
    image: grafana/k6:0.55.0
    profiles: ["load"]
    volumes:
      - ./loadgen:/scripts:ro
    command: ["run", "/scripts/steady.js"]
    environment:
      TARGET: http://gateway:8000

volumes:
  prom-data:
  grafana-data:
